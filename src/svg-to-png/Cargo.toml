[package]
name = "svg-to-png"
version = "0.1.0"
edition = "2021"

[dependencies]
resvg = "0.49"
roxmltree = "0.21"
svg-font-inliner = { path = "../svg-font-inliner" }
svgtypes = "0.16"
usvg = "0.49"

[dev-dependencies]
base64 = "0.23"

# xmlwriter 0.1.0 (used by usvg to write SVG) only escapes quotes in attribute values, see the vendored copy
[patch.crates-io]
xmlwriter = { path = "../svg-font-inliner/vendor/xmlwriter" }
