[package]
name = "svg-font-inliner"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
data-url = "0.3"
lightningcss = "1.0.0-alpha.70"
roxmltree = "0.21"
serde_json = "1.0"
tempfile = "3"
ttf-parser = "0.25"
usvg = "0.49"
quick-xml = "0.42"

# xmlwriter 0.1.0 (used by usvg to write SVG) only escapes quotes in attribute values, see the vendored copy
[patch.crates-io]
xmlwriter = { path = "vendor/xmlwriter" }
